<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/css/style.css">
        <title>DASQUIRE</title>
        <link rel="icon" type="image/x-icon" href="/images/dasquirel1.png">
    </head>
    
    <body>
        <nav class="navbar-accedi">
            <a href="/" class="nav-link"><h1>DASQUIRE</h1></a>
        </nav>
        
        <div class="container-accedi">
            <img src="/images/dasquirel2.png">
        </div>
        <div th:if="${param.error}" style="color:red">Credenziali non valide.</div>
        <div th:if="${param.logout}" style="color:green">Disconnesso.</div>
        <form class="form-accedi" th:action="@{/accedi}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="text" placeholder="Email o Nickname" name="email" required>
            <input type="password" placeholder="password" name="password" required>
            <button type="submit">Accedi</button>
        </form>
    </body>
</html>
